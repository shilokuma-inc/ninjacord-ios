<!doctype html>
<!--
  App Store のクリエイティブアセット（プロダクトページのヘッダー / 検索結果）の元。
  Tools/render_creative_assets.sh が Chrome で開いて書き出す。直接開くときは
  creative.html?type=header&lang=ja のように指定する（screens/<言語>/ に 6.9 inch のスクリーンショットが要る）。

  方針（https://developer.apple.com/app-store/asset-best-practices/）
  - Discord のチャンネル画面そのものを背景にし、「このBot誰が入れたの？」「スマホから送ってる」という
    メンバーの会話を見出しの代わりにする。グラデーション・光・星・極太の見出しのような、
    生成された画像でよく見る飾りは使わない（Issue #660）。
  - ヘッダー: 端末によって左右が切れるので、会話と Bot の投稿は中央に寄せる。
  - 検索結果: アプリが何をするかを一目でわかるように、実際の画面（送信画面）も見せる。
  - 他社のロゴ・価格・受賞歴は入れない。文言は短く、言語ごとに訳す。

  レイアウトは小さな基準の寸法（ヘッダー 1344×576 / 検索結果 1200×800）で組み、CSS の zoom で
  書き出す寸法に合わせる。transform: scale と違い、拡大後の寸法で描き直すので文字がにじまない。
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* 色は Discord のダークテーマに合わせる */
  :root {
    --chat: #313338;
    --sidebar: #2b2d31;
    --divider: #26272b;
    --text: #f2f3f5;
    --text-2: #b5bac1;
    --text-3: #949ba4;
    --body: #dbdee1;
    --new: #f23f43;
    --blurple: #5865f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--chat); }
  body { color: var(--text); font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .stage { position: relative; overflow: hidden; background: var(--chat); }
  .channel { position: absolute; left: 0; right: 0; top: 0; height: 52px; padding: 0 32px; border-bottom: 1px solid var(--divider);
    display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .channel .hash { font-size: 22px; font-weight: 500; color: #80848e; }

  .message { display: flex; gap: 16px; }
  .avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 19px; }
  .author { font-size: 17px; font-weight: 700; }
  .author .app { font-size: 11px; font-weight: 500; color: #fff; background: var(--blurple); border-radius: 3px; padding: 1px 5px; vertical-align: 2px; }
  .author .time { font-size: 13px; font-weight: 400; color: var(--text-3); margin-left: 4px; }
  .content { margin-top: 4px; font-size: 17px; line-height: 1.55; color: var(--body); }
  .mention { color: #c9cdfb; background: rgba(88, 101, 242, 0.3); border-radius: 3px; padding: 0 2px; }
  .embed { margin-top: 10px; width: 440px; padding: 14px 16px; border-radius: 4px; background: var(--sidebar); border-left: 4px solid #3ba55c; }
  .embed .title { font-size: 16px; font-weight: 700; }
  /* 日本語は文節で折り返す（語の途中で切らない） */
  .embed .description { margin-top: 6px; font-size: 14px; color: var(--body); word-break: auto-phrase; }
  .embed .fields { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 13px; }
  .embed .fields b { display: block; }
  .embed .fields span { color: var(--body); }
  .new { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 12px; font-weight: 700; color: var(--new); }
  .new::before { content: ""; flex: 1 1 0; height: 1px; background: var(--new); }

  /* 見出しの代わりにするメンバーの会話。UI の書体に近い BIZ UDPGothic で、飾らずに大きくする */
  .talk { position: absolute; display: flex; flex-direction: column; font-family: "BIZ UDPGothic", "Hiragino Sans", sans-serif; }
  .talk .avatar { width: 52px; height: 52px; font-size: 20px; }
  .talk .author { font-size: 18px; }
  .talk .line { margin-top: 6px; font-weight: 700; line-height: 1.35; color: var(--text); }

  .brand { position: absolute; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; }
  .brand img { width: 40px; height: 40px; border-radius: 9px; }
  .brand span { font-weight: 500; color: var(--text-2); }

  /* 端末は飾らず、黒い縁だけにする */
  .phone { position: absolute; padding: 10px; border-radius: 52px; background: #0b0b0c; box-shadow: 0 0 0 1px #45474d; }
  .phone div { width: 100%; height: 100%; border-radius: 43px; overflow: hidden; }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "header";
  const lang = params.get("lang") || "ja";
  document.documentElement.lang = lang;

  const copy = {
    ja: {
      channel: "ゲーム部-お知らせ",
      bot: {
        name: "レイド告知Bot", time: "今日 21:00",
        body: '<span class="mention">@everyone</span> 今夜のレイド、参加者募集中です！',
        title: "今夜 21:00 レイド開始", description: "初参加も大歓迎です。開始 10 分前にはボイスチャンネルに集まってください。",
        fields: [["集合", "20:50"], ["場所", "#作戦室"], ["募集", "残り 3 枠"]],
      },
      talk: [
        { name: "けんた", initial: "け", time: "今日 21:02", line: "このBotって<br>誰が入れたの？" },
        { name: "みさき", initial: "み", time: "今日 21:03", line: "入れてないよ。<br>スマホから送ってる 📱" },
      ],
      app: "Webhook でメッセージを送るアプリ",
    },
    en: {
      channel: "announcements",
      bot: {
        name: "Raid Bot", time: "Today at 9:00 PM",
        body: '<span class="mention">@everyone</span> Sign-ups for tonight\'s raid are open!',
        title: "Raid starts tonight at 9 PM", description: "First-timers welcome. Please join the voice channel 10 minutes early.",
        fields: [["Meet-up", "8:50 PM"], ["Where", "#war-room"], ["Slots", "3 left"]],
      },
      talk: [
        { name: "Alex", initial: "A", time: "Today at 9:02 PM", line: "Wait, who added<br>this bot?" },
        { name: "Mia", initial: "M", time: "Today at 9:03 PM", line: "Nobody. I post it<br>from my phone 📱" },
      ],
      app: "Webhook messages from your phone",
    },
  }[lang];
  // 文言の無い言語は、崩れた画像を書き出さないようここで止める（render_creative_assets.sh でも先に確かめる）
  if (!copy) {
    document.body.innerHTML = `<h1 style="color:red;font-size:200px">No copy for "${lang}"</h1>`;
    throw new Error(`creative.html に ${lang} の文言がありません`);
  }

  const [baseWidth, baseHeight] = type === "header" ? [1344, 576] : [1200, 800];
  const stage = document.getElementById("stage");
  stage.style.width = `${baseWidth}px`;
  stage.style.height = `${baseHeight}px`;
  stage.style.zoom = innerWidth / baseWidth;
  const add = (html) => { stage.insertAdjacentHTML("beforeend", html); return stage.lastElementChild; };

  // Bot のアイコンは、送信画面のプレビューに出るデモのアイコン（ScreenshotDemo.avatarImage）にそろえる
  const BOT_AVATAR = `<div class="avatar" style="background:linear-gradient(135deg,#fee75c,#ed4245)">` +
    `<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/></svg></div>`;
  const AVATAR_COLORS = { talk: ["#a78bdb", "#e06c75"], name: ["#c9b6f2", "#f2a7ad"] };

  add(`<div class="channel"><span class="hash">#</span>${copy.channel}</div>`);

  // Ninja Cord から送った Bot の投稿（新着の区切り線の下に届いたところ）
  const botMessage = (x, y) => {
    const b = copy.bot;
    add(`<div style="position:absolute;left:${x}px;top:${y}px;width:504px">` +
      `<div class="new">${lang === "ja" ? "新着" : "NEW"}</div>` +
      `<div class="message">${BOT_AVATAR}` +
      `<div><div class="author">${b.name} <span class="app">${lang === "ja" ? "アプリ" : "APP"}</span><span class="time">${b.time}</span></div>` +
      `<div class="content">${b.body}</div>` +
      `<div class="embed"><div class="title">${b.title}</div><div class="description">${b.description}</div>` +
      `<div class="fields">${b.fields.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("")}</div></div>` +
      `</div></div></div>`);
  };

  const talk = (x, y, width, fontSize, gap) => add(
    `<div class="talk" style="left:${x}px;top:${y}px;width:${width}px;gap:${gap}px">` +
    copy.talk.map((t, i) =>
      `<div class="message"><div class="avatar" style="background:${AVATAR_COLORS.talk[i]}">${t.initial}</div>` +
      `<div><div class="author" style="color:${AVATAR_COLORS.name[i]}">${t.name}<span class="time">${t.time}</span></div>` +
      `<div class="line" style="font-size:${fontSize}px">${t.line}</div></div></div>`).join("") +
    `</div>`);

  const brand = (x, y) => add(`<div class="brand" style="left:${x}px;top:${y}px"><img src="icon.png" alt="">Ninja Cord<span>${copy.app}</span></div>`);

  const phone = (screen, x, y, width, height) => add(
    `<div class="phone" style="left:${x}px;top:${y}px;width:${width}px;height:${height}px">` +
    `<div><img src="screens/${lang}/${screen}.png" alt=""></div></div>`);

  if (type === "header") {
    // 21:9。左右は端末によって切れるので、会話と投稿は中央の 1000px ほどに収める
    talk(170, 104, 500, 38, 30);
    brand(170, 478);
    botMessage(690, 130);
  } else {
    // 3:2。左に Bot の投稿とメンバーの会話、右に実際の送信画面
    botMessage(64, 84);
    talk(64, 366, 640, 34, 26);
    brand(64, 716);
    phone("01_send", 770, 100, 360, 760);
  }
</script>
</body>
</html>
