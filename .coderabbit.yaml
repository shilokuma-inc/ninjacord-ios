# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定: https://docs.coderabbit.ai/reference/configuration
language: ja-JP

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # デフォルトブランチ (develop) 以外に向けた PR もレビューする
    base_branches:
      - "release/.*"
      - "master"
  path_filters:
    # 自動生成・バイナリ系はレビュー対象外
    - "!**/*.xcassets/**"
    - "!**/Package.resolved"
    - "!**/*.pbxproj"
    - "!DerivedData/**"
  path_instructions:
    - path: "NinjacordPackage/Sources/**/*.swift"
      instructions: |
        SwiftUI / Swift Concurrency の観点でレビューしてください。
        - Deployment Target は iOS 16.0。iOS 17 以降の API (@Observable 等) は #available なしで使わないこと
        - State 管理 (@State / @StateObject / @ObservedObject / @Binding) の使い分けが適切か
        - MainActor 分離や Sendable の問題がないか
        - NinjacordApp ターゲットから参照する型 (MainView / AppDelegate) 以外は internal のままにする
  tools:
    swiftlint:
      enabled: true
      config_file: ".swiftlint.yml"

chat:
  auto_reply: true
