name: Upload/develop

on:
  push:
    branches: develop

# App Store Connect へのアップロードが並走すると、同じビルド番号で衝突して 409 になる。
# upload 系ワークフロー全体で 1 本ずつ実行する。
concurrency:
  group: upload-app-store-connect
  cancel-in-progress: false

jobs:          
  build:
    name: Upload/develop
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          brew install swiftlint
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # -allowProvisioningUpdates は runner ごとに Apple Development 証明書を新規発行してしまい、
      # アカウントの証明書上限に達して archive が落ちる (Issue #235)。
      # Secrets の Apple Distribution 証明書と Provisioning Profile を持ち込んで手動署名する。
      - name: Import Code Signing Assets
        env:
          P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # 一時キーチェーンを作成する（runner ごと破棄されるので後片付けは不要）
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Apple Distribution 証明書を import する
          echo -n "$P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          # App Store 用 Provisioning Profile を配置し、プロファイル名を後続ステップへ渡す
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo -n "$PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILES_DIR/appstore.mobileprovision"
          PROFILE_NAME="$(security cms -D -i "$PROFILES_DIR/appstore.mobileprovision" | plutil -extract Name raw -)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Determine Build Number
        id: build_number
        run: echo "value=$(date -u +%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Archive Project
        run: |
          xcodebuild archive \
            -project NinjacordApp.xcodeproj \
            -scheme NinjacordApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath NinjacordApp.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM=XU74X3434S

      # EXPORT_OPTIONS はリポジトリ secret（signingStyle: manual）。org secret の自動署名用を上書きしている
      - name: Create ExportOptions.plist
        run: |
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath NinjacordApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath app.ipa

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app -f app.ipa/NinjacordApp.ipa \
                       -u ${{ secrets.APPLE_ID }} \
                       -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                       --type ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjacordApp-ipa
          path: app.ipa/NinjacordApp.ipa