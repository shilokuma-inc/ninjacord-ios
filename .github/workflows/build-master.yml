name: Build/master

on:
  push:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches: master

# 同じブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build/master
    runs-on: macos-latest

    env:
      PROJECT: NinjacordApp.xcodeproj
      SCHEME: NinjacordApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: ci_post_clone
        run: |
          brew install swiftlint
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # 依存の取得（Firebase などの clone）に毎回 1 分以上かかるため、SourcePackages ごと保存する。
      # Build 系のワークフローで同じパス・キーにして、キャッシュを共有する
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          # restore-keys は付けない。依存が変わったときに古い依存入りのキャッシュを復元し、そのまま保存し直して肥大化するため
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
