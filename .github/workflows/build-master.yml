name: Build/master

on:
  push:
    branches: master

jobs:
  build:
    name: Build/master
    runs-on: macos-latest

    env:
      PROJECT: NinjacordApp.xcodeproj
      SCHEME: NinjacordApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          brew install swiftlint
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # 依存の取得（Firebase などの clone）に毎回 1 分以上かかるため、SourcePackages ごと保存する。
      # Build 系のワークフローで同じパス・キーにして、キャッシュを共有する
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
