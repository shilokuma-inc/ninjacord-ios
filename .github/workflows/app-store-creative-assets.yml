name: Creative assets/App Store

# プロダクトページのヘッダーと検索結果のクリエイティブアセット（iOS 27 以降の App Store に出る）を
# App Store Connect の App Asset Library に上げ、編集できるバージョンに配置する。
#
# 置き場所と画像は AppStore/creative_assets.json と AppStore/creative/<言語>/。
# 画像を作り直すときは Tools/render_creative_assets.sh で書き出してからコミットする。
# 反映先は「編集できる状態のバージョン」だけ。審査中・配信済みのバージョンには触らない。

on:
  # TEMP: workflow_dispatch は develop に入るまで使えないので、作業ブランチの push で動かす
  push:
    branches:
      - feat/app-store-product-page
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: 反映する / dry-run: やることだけ出す / ref-data: 置き場所と画像の仕様を出す'
        type: choice
        options:
          - upload
          - dry-run
          - ref-data
        default: dry-run
      languages:
        description: '反映する言語（カンマ区切り）。空なら languages.json の全言語（ja / en）'
        required: false
        default: ''
      app_version:
        description: '反映先のバージョン。空なら編集できるバージョンを自動で選ぶ'
        required: false
        default: ''

jobs:
  creative-assets:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Private Key
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > private_keys/AuthKey.p8

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: private_keys/AuthKey.p8
          MODE: ${{ inputs.mode || 'ref-data' }}
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=()
          case "$MODE" in
            dry-run) options+=(--dry-run) ;;
            ref-data) options+=(--ref-data) ;;
          esac
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi

          .venv/bin/python -u Tools/upload_creative_assets.py "${options[@]}" | tee "$RUNNER_TEMP/upload.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "## クリエイティブアセット（${{ inputs.mode }}）"
            echo
            echo '```'
            cat "$RUNNER_TEMP/upload.log" 2>/dev/null || echo "（出力なし）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
