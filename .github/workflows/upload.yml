name: Upload

# develop / release/** への push で Archive → App Store Connect へアップロードする。
# epic ブランチなどの作業ブランチを TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ
# （AskHub の「マージ待ち」からもこのワークフローを起動する。ファイル名 upload.yml は AskHub との取り決め）。
# 作業ブランチの push ごとに上げると App Store Connect の 1 日あたりのアップロード上限に当たるため、自動では上げない。

on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# App Store Connect へのアップロードが並走すると、同じビルド番号で衝突して 409 になる。
# upload 系ワークフロー全体で 1 本ずつ実行する。
concurrency:
  group: upload-app-store-connect
  cancel-in-progress: false

jobs:          
  build:
    name: Upload (${{ github.ref_name }})
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Checkout
        uses: actions/checkout@v7

      - name: ci_post_clone
        run: |
          brew install swiftlint
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Determine Build Number
        id: build_number
        run: echo "value=$(date -u +%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      # 配信用の署名は書き出し（Export）で App Store Connect API キーの自動署名で行うので、Archive は署名しない。
      # Archive で自動署名（-allowProvisioningUpdates）すると、runner ごとに Apple Development 証明書を新規発行してしまい、
      # アカウントの証明書上限に達して archive が落ちる（Issue #235）。署名しなければ Development 証明書は作られない。
      # NinjacordApp.entitlements は空なので、署名なしの Archive で entitlements が抜ける心配はない
      - name: Archive Project
        run: |
          xcodebuild archive \
            -project NinjacordApp.xcodeproj \
            -scheme NinjacordApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath NinjacordApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }}

      # 静的な xcframework（Firebase・Google Mobile Ads など）は、同梱するときに Xcode がバイナリを外して空のスタブを差し込む。
      # スタブはリンカーの仮の署名のままで識別子が arm64-apple になっていて、署名なしの Archive では Xcode の署名で直らない。
      # Export はこの識別子のまま再署名するので、App Store Connect が Invalid Signature で弾く。
      # Info.plist の CFBundleIdentifier と識別子が違うフレームワークを、その識別子でアドホック署名し直す（本番の署名は Export がする。
      # shilokuma-inc/app-kit の tools/fix-stub-framework-signatures.sh と同じ直し）
      - name: Fix signatures of stub frameworks
        run: |
          set -euo pipefail
          frameworks="NinjacordApp.xcarchive/Products/$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' NinjacordApp.xcarchive/Info.plist)/Frameworks"
          [[ -d "$frameworks" ]] || exit 0
          for framework in "$frameworks"/*.framework; do
            [[ -e "$framework" ]] || continue
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$framework/Info.plist")
            identifier=$(codesign -dv "$framework" 2>&1 | sed -n 's/^Identifier=//p')
            if [[ "$identifier" != "$bundle_id" ]]; then
              codesign --force --sign - --identifier "$bundle_id" "$framework"
              echo "$(basename "$framework"): 署名の識別子を ${identifier:-（署名なし）} から $bundle_id に直しました"
            fi
          done

      # EXPORT_OPTIONS は organization の Secret（自動署名）を使う。手動署名の Secret がリポジトリに残っていると、
      # そちらが優先されて書き出しが証明書・プロファイル不足で落ちるので、先に止めて理由を出す。
      # 書き出しは手元で行い（destination: export）、アップロードは下の altool で行う
      - name: Create ExportOptions.plist
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPORT_OPTIONS" > ExportOptions.plist
          plutil -lint ExportOptions.plist
          if [[ "$(plutil -extract signingStyle raw ExportOptions.plist 2>/dev/null || true)" == "manual" ]]; then
            echo "::error::EXPORT_OPTIONS が手動署名（signingStyle: manual）です。リポジトリの Secret EXPORT_OPTIONS を消して、organization の自動署名のものを使ってください"
            exit 1
          fi
          plutil -replace destination -string export ExportOptions.plist

      # 書き出しとアップロードは App Store Connect API Key で認証する。altool は --apiKey の Key ID から
      # ./private_keys/AuthKey_<Key ID>.p8 を探す
      - name: Create Private Key
        run: |
          mkdir -p private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath NinjacordApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath app.ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
            -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app -f app.ipa/NinjacordApp.ipa \
                       --apiKey ${{ secrets.APPLE_API_KEY_ID }} \
                       --apiIssuer ${{ secrets.APPLE_API_ISSUER_ID }} \
                       --type ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NinjacordApp-ipa
          path: app.ipa/NinjacordApp.ipa