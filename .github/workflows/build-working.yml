name: Build

# assets/** はスクリーンショット置き場でアプリのコードを含まないため除外する。
on:
  push:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches:
      - '**'
      - '!master'
      - '!develop'
      - '!assets/**'

# 同じブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest

    env:
      PROJECT: NinjacordApp.xcodeproj
      SCHEME: NinjacordApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: ci_post_clone
        run: |
          brew install swiftlint
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # 依存の取得（Firebase などの clone）に毎回 1 分以上かかるため、SourcePackages ごと保存する。
      # Build 系のワークフローで同じパス・キーにして、キャッシュを共有する
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          # restore-keys は付けない。依存が変わったときに古い依存入りのキャッシュを復元し、そのまま保存し直して肥大化するため
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" -derivedDataPath "$RUNNER_TEMP/DerivedData"

      # SWIFT_EMIT_LOC_STRINGS=YES で、ローカライズ対象の文言を .stringsdata に書き出す（次の Check localizations で使う）
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" SWIFT_EMIT_LOC_STRINGS=YES

      # アプリのコードは Swift Package にあり、文言が String Catalog に自動で抽出されないため、載せ忘れをここで落とす
      - name: Check localizations
        run: python3 Tools/check_localizations.py --derived-data "$RUNNER_TEMP/DerivedData"

      # NinjacordPackage のユニットテスト（NinjacordApp の scheme の TestAction）。テストは上の Build でビルド済みなので、ビルドし直さずに流す。
      # Simulator の名前はランナーのイメージで変わるため、名前ではなく一覧から選ぶ。並列テストは Simulator の clone の起動で遅くなるので切る
      - name: Test
        run: |
          set -euo pipefail
          UDID="$(python3 Tools/select_test_simulator.py)"
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -parallel-testing-enabled NO
